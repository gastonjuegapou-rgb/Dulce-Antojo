<head>
<meta charset="utf-8">

<title>Dulce Antojo</title>
<style>
  :root {
    --rosa: #e8738f;
    --rosa-osc: #c94f6d;
    --crema: #fff7f2;
    --texto: #4a2c35;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--crema);
    color: var(--texto);
    line-height: 1.5;
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, var(--rosa) 0%, var(--rosa-osc) 100%);
    color: #fff;
    text-align: center;
    padding: 34px 20px 28px;
    box-shadow: 0 4px 14px rgba(201,79,109,.25);
  }
  header h1 {
    font-size: 2rem;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  header p {
    font-size: .98rem;
    opacity: .95;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 22px 16px 0;
  }
  figure {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(74,44,53,.10);
    margin-bottom: 26px;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
  }
  figcaption {
    text-align: center;
    font-size: .92rem;
    color: var(--rosa-osc);
    font-weight: 600;
    padding: 12px 14px;
  }
  footer {
    text-align: center;
    font-size: .82rem;
    color: #9a7d85;
    margin-top: 8px;
  }
</style>
